name: Sync songs from YouTube

on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 7am New York time
  workflow_dispatch: {}     # "Run workflow" button for an immediate sync

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Sync
        id: sync
        run: |
          python .github/scripts/sync_youtube.py | tee "$RUNNER_TEMP/sync.log"
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain -- index.html thumbs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A index.html thumbs
            git commit -m "Sync songs from YouTube" -m "$(cat "$RUNNER_TEMP/sync.log")"
            git push
          else
            echo "Nothing to commit."
          fi
